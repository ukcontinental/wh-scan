</style></head><body><div class="card fit"><div class="bar"><div class="logo" style="display:flex;flex-direction:row;align-items:center;gap:13px"><svg width="76" height="76" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="47" fill="#ffffff"/><text x="50" y="64" font-size="40" font-weight="700" text-anchor="middle" fill="#2c3e50" font-family="Liberation Sans">H</text></svg><span class="wm" style="font-size:3.1rem;color:#ffffff;font-family:'Liberation Sans','DejaVu Sans','Noto Sans CJK TC',sans-serif;font-weight:700;letter-spacing:.06em;white-space:nowrap">HAIYUN</span></div><div><div class="bco">大连海韵水产有限公司</div></div></div><div class="body"><div class="fit" style="overflow:hidden"><div class="nm">周晓明</div><div class="tt">质量经理</div></div><div class="fit" style="overflow:hidden;display:flex;gap:16px"><div style="flex:1;min-width:0"><div class="ct"><div class="ln">座机：+86-411-51976045</div><div class="ln">邮箱：tzhou@haiyunseafood.cn</div><div class="ln">haiyunseafood.cn</div><div class="ln">微信：zhoutony98</div></div><div class="addr"><div class="alab">总部</div><div>辽宁省大连市中山区港兴路7号</div><div>邮编：116001</div></div><div class="addr"><div class="alab">工厂</div><div>上海市浦东新区张江路88号3号楼501室</div><div>邮编：200120</div></div></div></div></div><div class="foot"><span>ISO 22000  ·  FSSC 22000</span></div></div>
<script>
window.__fit = function(){
  const root = document.documentElement; let s = 1.0;
  const els = Array.from(document.querySelectorAll('.fit'));
  const over = () => els.some(el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
  while (over() && s > 0.5) { s = Math.round((s - 0.03) * 100) / 100; root.style.setProperty('--s', s); }
  return s;
};
</script></body></html>
