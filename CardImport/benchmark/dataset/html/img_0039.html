<!doctype html><html lang="zh-TW"><head><meta charset="utf-8">
<style>
:root{--s:1}
html{font-size:calc(10px * var(--s))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:600px;height:1050px;overflow:hidden;background:#fff}
body{font-family:'Noto Sans CJK TC','WenQuanYi Zen Hei','Liberation Sans',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.card{width:600px;height:1050px;overflow:hidden;position:relative}
.ln{white-space:nowrap}

.card{background:#fdfcf8;color:#222;padding:56px 50px 40px}
.vr{writing-mode:vertical-rl;height:820px;width:100%;font-family:'Noto Sans CJK TC','WenQuanYi Zen Hei','Liberation Sans',sans-serif;display:flex;flex-direction:column;flex-wrap:nowrap}
.co{font-size:2.60rem;color:#5b3e96;letter-spacing:.12em;margin-left:22px;align-self:flex-start}
.tt{font-size:2.40rem;letter-spacing:.2em;margin-left:16px;align-self:flex-start;padding-top:120px}
.dp{font-size:2.10rem;letter-spacing:.15em;color:#555;margin-left:12px;align-self:flex-start;padding-top:60px}
.nm{font-size:6.40rem;font-weight:700;letter-spacing:.35em;margin-left:40px;margin-right:10px;align-self:center;white-space:nowrap}
.ad{font-size:1.95rem;line-height:1.55;margin-left:6px;color:#333;align-self:flex-end}
.ad .alab{color:#5b3e96}
.ph{font-size:1.95rem;line-height:1.55;color:#333;align-self:inherit;}
.cg{display:flex;flex-direction:column;align-self:stretch;justify-content:flex-start}
.cg>div{align-self:flex-start}
.ex{font-size:1.70rem;color:#999;letter-spacing:.1em;align-self:flex-start;padding-top:40px}
.foot{position:absolute;left:46px;bottom:36px;display:flex;align-items:flex-end;gap:14px}

</style></head><body><div class="card fit"><div class="vr fit"><div class="co">真北食品經銷有限公司</div><div class="tt">品保經理</div><div class="nm">陳 欣 怡</div><div class="cg"><div class="ad">安大略省萬錦7號公路東3601號1008室　郵遞區號 L3R 0M3</div><div class="ph">電話 (905) 555-0138</div><div class="ad">olivia.chen@truenorthfood.ca</div><div class="ad">orders@truenorthfood.ca</div><div class="ad">網址：truenorthfood.ca</div></div></div><div class="foot"><div class="logo" style="display:flex;flex-direction:row;align-items:center;gap:12px"><svg width="70" height="70" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="47" fill="#5b3e96"/><path d="M12 38 Q31 26 50 38 T88 38" stroke="#ffffff" stroke-width="6" fill="none"/><path d="M12 54 Q31 42 50 54 T88 54" stroke="#ffffff" stroke-width="6" fill="none"/><path d="M12 70 Q31 58 50 70 T88 70" stroke="#ffffff" stroke-width="6" fill="none"/></svg><span class="wm" style="font-size:2.2rem;color:#5b3e96;font-family:'Liberation Sans','DejaVu Sans','Noto Sans CJK TC',sans-serif;font-weight:700;letter-spacing:.06em;white-space:nowrap">TRUE NORTH</span></div></div></div>
<script>
window.__fit = function(){
  const root = document.documentElement; let s = 1.0;
  const els = Array.from(document.querySelectorAll('.fit'));
  const over = () => els.some(el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
  while (over() && s > 0.5) { s = Math.round((s - 0.03) * 100) / 100; root.style.setProperty('--s', s); }
  return s;
};
</script></body></html>
