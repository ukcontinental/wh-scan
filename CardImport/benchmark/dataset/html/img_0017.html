<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">

.addr{font-size:2.00rem;line-height:1.35;color:#444} .addr+.addr{margin-top:6px} .alab{font-weight:700;color:#c4561d}

</style></head><body><div class="card"><div class="main fit"><div style="display:flex;gap:22px;align-items:center"><div><div class="nm">王芳</div></div></div><div><div class="tt">董事长</div><div class="dp">销售部</div></div><div class="rule"></div><div style="display:flex;gap:24px;align-items:flex-end;justify-content:space-between"><div><div class="ct"><div class="ln">TEL：021-8944 1205</div><div class="ln">邮箱：wang.fang@xinyuanfood.com.cn</div><div class="ln">xinyuanfood.com.cn</div><div class="ln">微信：wangfang88</div></div><div class="addr"><div>上海市浦东新区张江路88号3号楼501室</div><div>邮编：200120</div></div><div class="ex">HACCP  ·  FSSC 22000</div></div></div></div><div class="band fit"><div class="logo" style="display:flex;flex-direction:column;align-items:center;gap:30px"><svg width="170" height="170" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M50 96 C8 70 8 26 50 4 C92 26 92 70 50 96Z" fill="#ffffff"/><path d="M50 90 L50 18 M50 50 L30 35 M50 65 L70 48" stroke="#c4561d" stroke-width="4" fill="none"/></svg></div><div><div class="bco">上海鑫源食品有限公司</div></div></div></div>
<script>
window.__fit = function(){
  const root = document.documentElement; let s = 1.0;
  const els = Array.from(document.querySelectorAll('.fit'));
  const over = () => els.some(el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
  while (over() && s > 0.5) { s = Math.round((s - 0.03) * 100) / 100; root.style.setProperty('--s', s); }
  return s;
};
</script></body></html>
