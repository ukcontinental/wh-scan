<!doctype html><html lang="en"><head><meta charset="utf-8">
<style>
:root{--s:1}
html{font-size:calc(10px * var(--s))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1050px;height:600px;overflow:hidden;background:#fff}
body{font-family:'Liberation Sans','DejaVu Sans','Noto Sans CJK TC',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.card{width:1050px;height:600px;overflow:hidden;position:relative}
.ln{white-space:nowrap}

.card{background:#fff;border-left:16px solid #00798c;padding:58px 70px 52px 74px;display:flex;flex-direction:column;justify-content:space-between;color:#222}
.top{display:flex;align-items:center;justify-content:space-between;gap:24px}
.co{font-size:2.50rem;font-weight:700;color:#00798c;letter-spacing:.03em}
.co2{font-size:1.90rem;color:#666;margin-top:4px}
.nm{font-size:5.60rem;font-weight:700;font-style:normal;line-height:1.15;white-space:nowrap}
.nm2{font-size:3.00rem;color:#444;margin-top:2px;white-space:nowrap}
.tt{font-size:2.60rem;color:#00798c;margin-top:10px;white-space:nowrap}
.tt2,.dp{font-size:2.20rem;color:#666;margin-top:3px;white-space:nowrap}
.bot{display:flex;justify-content:space-between;align-items:flex-end;gap:30px}
.ct{font-size:2.30rem;line-height:1.42;color:#333}
.ad{font-size:2.10rem;line-height:1.35;color:#444;text-align:right;max-width:470px}
.addr+.addr{margin-top:8px} .alab{font-weight:700;color:#00798c}
.ex{font-size:1.80rem;color:#888;font-style:italic;margin-top:6px}

</style></head><body><div class="card fit"><div class="top"><div><div class="co">Cedarline Logistics Inc.</div></div><div style="display:flex;gap:18px;align-items:center"><div class="logo" style="display:flex;flex-direction:row;align-items:center;gap:16px"><svg width="92" height="92" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><polygon points="50,3 93,27 93,73 50,97 7,73 7,27" fill="#00798c"/><polygon points="50,22 76,37 76,63 50,78 24,63 24,37" fill="none" stroke="#ffffff" stroke-width="6"/></svg><span class="wm" style="font-size:2.6rem;color:#00798c;font-family:'Liberation Sans','DejaVu Sans','Noto Sans CJK TC',sans-serif;font-weight:700;letter-spacing:.06em;white-space:nowrap">CEDARLINE</span></div></div></div><div><div class="nm">Sophie Lam</div><div class="tt">Director of Operations</div></div><div class="bot"><div class="ct"><div class="ln">M: +1-416-555-0172</div><div class="ln">P: +1-905-555-0171</div><div class="ln">F: +1-905-555-0197</div><div class="ln">E: sophiel@cedarline.ca</div><div class="ln">Web: www.cedarline.ca</div><div class="ln">in /sophie-lam</div></div><div style="display:flex;gap:20px;align-items:flex-end"><div class="ad"><div class="addr"><div>6750 Mississauga Rd, Unit 7</div><div>Mississauga, ON L5N 2L3</div><div>Canada</div></div></div></div></div></div>
<script>
window.__fit = function(){
  const root = document.documentElement; let s = 1.0;
  const els = Array.from(document.querySelectorAll('.fit'));
  const over = () => els.some(el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
  while (over() && s > 0.5) { s = Math.round((s - 0.03) * 100) / 100; root.style.setProperty('--s', s); }
  return s;
};
</script></body></html>
