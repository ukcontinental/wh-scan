<!doctype html><html lang="zh-TW"><head><meta charset="utf-8">
<style>
:root{--s:1}
html{font-size:calc(10px * var(--s))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1050px;height:600px;overflow:hidden;background:#fff}
body{font-family:'Noto Sans CJK TC','WenQuanYi Zen Hei','Liberation Sans',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.card{width:1050px;height:600px;overflow:hidden;position:relative}
.ln{white-space:nowrap}

.card{background:#d1495b;color:#f5f5f5;padding:56px 64px;display:flex;flex-direction:column;gap:22px;justify-content:center}
.co{font-size:2.5rem;font-weight:700;color:#ffffff}
.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;overflow:hidden}
.addr{font-size:2.1rem;line-height:1.38} .addr+.addr{margin-top:16px} .alab{font-weight:700;color:#ffffff;font-size:1.9rem;letter-spacing:.05em}
.ct{font-size:2.2rem;line-height:1.5}

</style></head><body><div class="card fit"><div><div class="logo" style="display:flex;flex-direction:row;align-items:center;gap:11px"><svg width="64" height="64" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><polygon points="50,6 94,30 6,30" fill="#ffffff"/><rect x="14" y="36" width="11" height="44" fill="#ffffff"/><rect x="34" y="36" width="11" height="44" fill="#ffffff"/><rect x="54" y="36" width="11" height="44" fill="#ffffff"/><rect x="74" y="36" width="11" height="44" fill="#ffffff"/><rect x="6" y="84" width="88" height="10" fill="rgba(255,255,255,.65)"/></svg></div></div><div class="grid fit"><div><div class="addr"><div class="alab">總公司</div><div>104 台北市中山區南京東路二段88號12樓</div></div><div class="addr"><div class="alab">工廠</div><div>407 台中市西屯區台灣大道三段99號8樓</div></div></div><div class="ct"><div class="ln">總機：+886 2 2078 8448</div><div class="ln">FAX：+886-2-2835-8395</div><div class="ln">service@hebangbank.com.tw</div><div class="ln">tina@hebangbank.com.tw</div><div class="ln">https://www.hebangbank.com.tw</div></div></div></div>
<script>
window.__fit = function(){
  const root = document.documentElement; let s = 1.0;
  const els = Array.from(document.querySelectorAll('.fit'));
  const over = () => els.some(el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
  while (over() && s > 0.5) { s = Math.round((s - 0.03) * 100) / 100; root.style.setProperty('--s', s); }
  return s;
};
</script></body></html>
