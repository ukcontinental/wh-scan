<!doctype html><html lang="zh-TW"><head><meta charset="utf-8">
<style>
:root{--s:1}
html{font-size:calc(10px * var(--s))}
*{box-sizing:border-box;margin:0;padding:0}

.card{width:1050px;height:600px;overflow:hidden;position:relative}
.ln{white-space:nowrap}

.card{background:#14213d;color:#e8e6df;display:grid;grid-template-columns:1.05fr 1fr;padding:60px 64px}
.l{display:flex;flex-direction:column;justify-content:space-between;padding-right:40px;border-right:2px solid #d4af37;overflow:hidden}
.r{display:flex;flex-direction:column;justify-content:center;padding-left:44px;gap:14px;overflow:hidden}
.nm{font-family:'Noto Serif CJK TC','Liberation Serif',serif;font-style:normal;font-size:5.00rem;color:#d4af37;line-height:1.15;white-space:nowrap}
.nm2{font-family:'Noto Serif CJK TC','Liberation Serif',serif;font-size:2.80rem;color:#d4af37;opacity:.85;white-space:nowrap}
.tt{font-size:2.30rem;letter-spacing:.12em;text-transform:uppercase;margin-top:12px;white-space:nowrap}
.tt2,.dp{font-size:2.10rem;opacity:.8;margin-top:4px;white-space:nowrap}
.co{font-family:'Noto Serif CJK TC','Liberation Serif',serif;font-size:2.40rem;color:#d4af37;letter-spacing:.05em}
.co2{font-size:1.80rem;opacity:.8}
.ct{font-size:2.20rem;line-height:1.45}
.addr{font-size:2.00rem;line-height:1.35;opacity:.92} .alab{color:#d4af37}
.ex{font-size:1.70rem;color:#d4af37;opacity:.8;letter-spacing:.08em}

</style></head><body><div class="card"><div class="l fit"><div><div class="logo" style="display:flex;flex-direction:row;align-items:center;gap:15px"><svg width="84" height="84" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="47" fill="#d4af37"/><text x="50" y="64" font-size="40" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Liberation Sans">CF</text></svg><span class="wm" style="font-size:2.4rem;color:#d4af37;font-family:'Noto Serif CJK TC','Liberation Serif',serif;font-weight:700;letter-spacing:.06em;white-space:nowrap">金穗</span></div></div><div><div class="nm">洪 詩 涵</div><div class="tt">業務專員</div></div><div><div class="co">嘉豐食品股份有限公司</div></div></div><div class="r fit"><div class="ct"><div class="ln">行動電話：+886 913 450 029</div><div class="ln">E-mail：sandy.hung@chiafeng.com.tw</div><div class="ln">網址：www.chiafeng.com.tw</div><div class="ln">LINE: sandy97</div></div><div class="addr"><div>台灣 220 新北市板橋區文化路一段188號</div></div><div style="display:flex;gap:16px;align-items:center"><div><div class="ex">ISO 9001:2015  ·  FSSC 22000</div></div></div></div></div>
<script>
window.__fit = function(){
  const root = document.documentElement; let s = 1.0;
  const els = Array.from(document.querySelectorAll('.fit'));
  const over = () => els.some(el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
  while (over() && s > 0.5) { s = Math.round((s - 0.03) * 100) / 100; root.style.setProperty('--s', s); }
  return s;
};
</script></body></html>
