<!doctype html><html lang="en"><head><meta charset="utf-8">
<style>
:root{--s:1}
html{font-size:calc(10px * var(--s))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1050px;height:600px;overflow:hidden;background:#fff}
body{font-family:'Liberation Sans','DejaVu Sans','Noto Sans CJK TC',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.card{width:1050px;height:600px;overflow:hidden;position:relative}
.ln{white-space:nowrap}

.card{background:#faf8f3;color:#2b2b2b;padding:46px 60px 40px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center}
.hd{width:100%;display:flex;justify-content:space-between;align-items:flex-start}
.co{font-size:2.00rem;letter-spacing:.2em;color:#555;text-align:left} .co2{font-size:1.60rem;color:#888;text-align:left}
.tt{font-size:1.90rem;letter-spacing:.25em;color:#666} .tt2,.dp{font-size:1.70rem;color:#888;letter-spacing:.1em}
.nm{font-family:'FreeSerif','Liberation Serif','DejaVu Serif','Noto Serif CJK TC',serif;font-style:italic;font-size:5.60rem;letter-spacing:.05em;margin:8px 0 2px;white-space:nowrap;font-weight:400}
.nm2{font-size:2.20rem;letter-spacing:.2em;color:#666;white-space:nowrap}
.ft{font-size:1.65rem;color:#555;line-height:1.6}
.ft .row{white-space:nowrap}
.ex{font-size:1.45rem;color:#999;letter-spacing:.1em}

</style></head><body><div class="card fit"><div class="hd"><div><div class="co">Empire Gourmet Imports Inc.</div></div><div class="logo" style="display:flex;flex-direction:row;align-items:center;gap:11px"><svg width="64" height="64" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="47" fill="#0b4f8a"/><text x="50" y="64" font-size="40" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Liberation Sans">EG</text></svg></div></div><div><div class="tt">President</div><div class="nm">Rachel Goldberg, MBA</div><div class="dp">Procurement</div></div><div class="ex">AURORA BAY</div><div class="ft"><div class="row">88 Canal St, 3rd Floor New York, NY 10002</div><div class="row">Cell: 1-212-555-0120 ｜ E rachel.goldberg@empiregourmet.com</div><div class="row">W www.empiregourmet.com</div><div class="ex">BRCGS AA  ·  HACCP</div></div></div>
<script>
window.__fit = function(){
  const root = document.documentElement; let s = 1.0;
  const els = Array.from(document.querySelectorAll('.fit'));
  const over = () => els.some(el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
  while (over() && s > 0.5) { s = Math.round((s - 0.03) * 100) / 100; root.style.setProperty('--s', s); }
  return s;
};
</script></body></html>
