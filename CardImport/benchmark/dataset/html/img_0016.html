<!doctype html><html lang="en"><head><meta charset="utf-8">
<style>
:root{--s:1}
html{font-size:calc(10px * var(--s))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1050px;height:600px;overflow:hidden;background:#fff}
body{font-family:'Liberation Sans','DejaVu Sans','Noto Sans CJK TC',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.card{width:1050px;height:600px;overflow:hidden;position:relative}
.ln{white-space:nowrap}

.card{background:linear-gradient(135deg,#1e1b4b,#4c1d95);color:#f1f5f9;padding:54px 60px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;gap:26px}
.nm{font-size:4.56rem;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.nm2{font-size:2.47rem;opacity:.8;white-space:nowrap}
.tt{font-size:2.09rem;color:#a5f3fc;margin-top:6px;white-space:nowrap} .tt2,.dp{font-size:1.80rem;opacity:.75;white-space:nowrap}
.mid{display:flex;justify-content:space-between;align-items:flex-end;gap:30px}
.ct{font-family:'DejaVu Sans Mono','Noto Sans Mono CJK TC',monospace;font-size:1.85rem;line-height:1.55}
.ct .ln::before{content:'›  ';color:#a5f3fc}
.addr{font-size:1.71rem;opacity:.85;line-height:1.3;margin-top:8px} .alab{color:#a5f3fc}
.co{font-size:1.90rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#a5f3fc}
.co2{font-size:1.61rem;opacity:.8}
.ex{font-size:1.52rem;opacity:.7}

</style></head><body><div class="card fit"><div class="top"><svg width="110" height="110" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><polygon points="50,3 93,27 93,73 50,97 7,73 7,27" fill="#a5f3fc"/><polygon points="50,22 76,37 76,63 50,78 24,63 24,37" fill="none" stroke="#ffffff" stroke-width="6"/></svg><div><div class="nm">Sarah MacDonald</div><div class="tt">General Manager</div></div></div><div class="mid"><div><div class="ct"><div class="ln">C 604-555-0198</div><div class="ln">T: 604 555 0161</div><div class="ln">Fax: +1 604 555 0109</div><div class="ln">E: sarah@northstarcoldchain.com</div><div class="ln">northstarcoldchain.com</div></div><div class="addr"><div>4321 Still Creek Dr, Unit 110</div><div>Burnaby, BC V5C 6S7</div><div>Canada</div></div></div></div><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:20px"><div><div class="co">Northstar Cold Chain Inc.</div></div><div style="text-align:right"></div></div></div>
<script>
window.__fit = function(){
  const root = document.documentElement; let s = 1.0;
  const els = Array.from(document.querySelectorAll('.fit'));
  const over = () => els.some(el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
  while (over() && s > 0.5) { s = Math.round((s - 0.03) * 100) / 100; root.style.setProperty('--s', s); }
  return s;
};
</script></body></html>
