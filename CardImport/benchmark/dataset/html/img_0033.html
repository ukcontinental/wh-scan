<!doctype html><html lang="en"><head><meta charset="utf-8">
<style>
:root{--s:1}
html{font-size:calc(10px * var(--s))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1050px;height:600px;overflow:hidden;background:#fff}
body{font-family:'Liberation Sans','DejaVu Sans','Noto Sans CJK TC',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.card{width:1050px;height:600px;overflow:hidden;position:relative}
.ln{white-space:nowrap}

.card{background:#fff;display:grid;grid-template-columns:1.15fr 1fr;padding:50px 56px;gap:40px}
.lg{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;overflow:hidden}
.info{display:flex;flex-direction:column;justify-content:center;gap:10px;overflow:hidden;border-left:2px solid #e3e3e3;padding-left:36px}
.nm{font-size:3.86rem;font-weight:700;font-style:normal;white-space:nowrap}
.nm2{font-size:2.39rem;color:#555;white-space:nowrap}
.tt{font-size:2.02rem;color:#6a2c8a;white-space:nowrap} .tt2,.dp{font-size:1.84rem;color:#777;white-space:nowrap}
.co{font-size:1.93rem;font-weight:700;color:#333;margin-top:8px} .co2{font-size:1.66rem;color:#777}
.ct{font-size:1.93rem;line-height:1.4;color:#333;margin-top:8px}
.addr{font-size:1.75rem;line-height:1.3;color:#555} .alab{font-weight:700}
.ex{font-size:1.56rem;color:#6a2c8a;text-align:center;letter-spacing:.06em}

</style></head><body><div class="card"><div class="lg fit"><div class="logo" style="display:flex;flex-direction:column;align-items:center;gap:45px"><svg width="250" height="250" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="47" fill="#6a2c8a"/><path d="M12 38 Q31 26 50 38 T88 38" stroke="#ffffff" stroke-width="6" fill="none"/><path d="M12 54 Q31 42 50 54 T88 54" stroke="#ffffff" stroke-width="6" fill="none"/><path d="M12 70 Q31 58 50 70 T88 70" stroke="#ffffff" stroke-width="6" fill="none"/></svg><span class="wm" style="font-size:4.6rem;color:#6a2c8a;font-family:'Liberation Sans','DejaVu Sans','Noto Sans CJK TC',sans-serif;font-weight:700;letter-spacing:.06em;white-space:nowrap">OCEAN CREST</span></div><div class="ex">Fresh from Ocean to Table</div><div class="ex">FSSC 22000</div></div><div class="info fit"><div class="nm">Kevin Zhang</div><div class="tt">Quality Assurance Manager</div><div class="co">Harbourview Frozen Foods Ltd.</div><div class="ct"><div class="ln">M: 647-555-0185</div><div class="ln">Direct: (416) 555-0168</div><div class="ln">F: 416.555.0123</div><div class="ln">E kevin.zhang@harbourviewfoods.ca</div><div class="ln">Web: https://www.harbourviewfoods.ca</div></div><div class="addr"><div>120 Front St W, Suite 400</div><div>Toronto, ON M5J 2M2</div></div></div></div>
<script>
window.__fit = function(){
  const root = document.documentElement; let s = 1.0;
  const els = Array.from(document.querySelectorAll('.fit'));
  const over = () => els.some(el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
  while (over() && s > 0.5) { s = Math.round((s - 0.03) * 100) / 100; root.style.setProperty('--s', s); }
  return s;
};
</script></body></html>
