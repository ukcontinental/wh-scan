.addr{font-size:1.60rem;line-height:1.35;opacity:.92} .alab{color:#c5a467}
.ex{font-size:1.36rem;color:#c5a467;opacity:.8;letter-spacing:.08em}

</style></head><body><div class="card"><div class="l fit"><div><div class="logo" style="display:flex;flex-direction:row;align-items:center;gap:15px"><svg width="84" height="84" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><polygon points="50,3 93,27 93,73 50,97 7,73 7,27" fill="#c5a467"/><polygon points="50,22 76,37 76,63 50,78 24,63 24,37" fill="none" stroke="#ffffff" stroke-width="6"/></svg><span class="wm" style="font-size:2.4rem;color:#c5a467;font-family:'Noto Serif CJK TC','Liberation Serif',serif;font-weight:700;letter-spacing:.06em;white-space:nowrap">KB LOGISTICS</span></div></div><div><div class="nm">陳嘉欣</div><div class="tt">總經理</div></div><div><div class="co">九龍灣物流有限公司</div></div></div><div class="r fit"><div class="ct"><div class="ln">手提電話：(852) 5365 4042</div><div class="ln">電話：+852-2600-0792</div><div class="ln">傳真：+852 2584 5611</div><div class="ln">信箱：vivian.chan@kblogistics.com.hk</div><div class="ln">信箱：contact@kblogistics.com.hk</div><div class="ln">網址：www.kblogistics.com.hk</div></div><div class="addr"><div>九龍觀塘鴻圖道12號永發工業大廈9樓B室</div></div><div style="display:flex;gap:16px;align-items:center"><div><div class="ex">安全 準時 專業</div><div class="ex">始於1962</div></div></div></div></div>
<script>
window.__fit = function(){
  const root = document.documentElement; let s = 1.0;
  const els = Array.from(document.querySelectorAll('.fit'));
  const over = () => els.some(el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
  while (over() && s > 0.5) { s = Math.round((s - 0.03) * 100) / 100; root.style.setProperty('--s', s); }
  return s;
};
</script></body></html>
