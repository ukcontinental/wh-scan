<!doctype html><html lang="en"><head><meta charset="utf-8">
<style>
:root{--s:1}
html{font-size:calc(10px * var(--s))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1050px;height:600px;overflow:hidden;background:#fff}
body{font-family:'Liberation Sans','DejaVu Sans','Noto Sans CJK TC',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.card{width:1050px;height:600px;overflow:hidden;position:relative}
.ln{white-space:nowrap}

.card{background:#faf8f3;color:#2b2b2b;padding:46px 60px 40px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center}
.hd{width:100%;display:flex;justify-content:space-between;align-items:flex-start}
.co{font-size:1.70rem;letter-spacing:.2em;color:#555;text-align:left} .co2{font-size:1.36rem;color:#888;text-align:left}
.tt{font-size:1.61rem;letter-spacing:.25em;color:#666} .tt2,.dp{font-size:1.44rem;color:#888;letter-spacing:.1em}
.nm{font-family:'Liberation Serif','DejaVu Serif','Noto Serif CJK TC',serif;font-style:normal;font-size:4.76rem;letter-spacing:.05em;margin:8px 0 2px;white-space:nowrap;font-weight:400}
.nm2{font-size:1.87rem;letter-spacing:.2em;color:#666;white-space:nowrap}
.ft{font-size:1.40rem;color:#555;line-height:1.6}
.ft .row{white-space:nowrap}
.ex{font-size:1.23rem;color:#999;letter-spacing:.1em}

</style></head><body><div class="card fit"><div class="hd"><div><div class="co">Chan &amp; Chan Trading Ltd.</div></div><div class="logo" style="display:flex;flex-direction:row;align-items:center;gap:11px"><svg width="64" height="64" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="22" y="22" width="48" height="48" transform="rotate(45 46 46)" fill="#a12a5e"/><rect x="34" y="34" width="48" height="48" transform="rotate(45 58 58)" fill="#14213d" opacity=".8"/></svg></div></div><div><div class="tt">Managing Director</div><div class="nm">Victoria CHAN</div></div><div class="ex">CHAN &amp; CHAN</div><div class="ft"><div class="row">Unit 1503, 15/F, Harbour Crest Centre, 30 Canton Road, Tsim Sha Tsui Kowloon</div><div class="row">M: +852-5521-7735 ｜ victoriac@chanandchan.com.hk</div><div class="row">Web: https://www.chanandchan.com.hk</div></div></div>
<script>
window.__fit = function(){
  const root = document.documentElement; let s = 1.0;
  const els = Array.from(document.querySelectorAll('.fit'));
  const over = () => els.some(el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
  while (over() && s > 0.5) { s = Math.round((s - 0.03) * 100) / 100; root.style.setProperty('--s', s); }
  return s;
};
</script></body></html>
