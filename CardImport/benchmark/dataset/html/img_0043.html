<!doctype html><html lang="zh-TW"><head><meta charset="utf-8">
<style>
:root{--s:1}
html{font-size:calc(10px * var(--s))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:600px;height:1050px;overflow:hidden;background:#fff}
body{font-family:'Noto Sans CJK TC','WenQuanYi Zen Hei','Liberation Sans',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.card{width:600px;height:1050px;overflow:hidden;position:relative}
.ln{white-space:nowrap}

.card{background:#fdfcf8;color:#222;padding:56px 50px 40px}
.vr{writing-mode:vertical-rl;height:820px;width:100%;font-family:'Noto Sans CJK TC','WenQuanYi Zen Hei','Liberation Sans',sans-serif;display:flex;flex-direction:column;flex-wrap:nowrap}
.co{font-size:2.21rem;color:#c4561d;letter-spacing:.12em;margin-left:22px;align-self:flex-start}
.tt{font-size:2.04rem;letter-spacing:.2em;margin-left:16px;align-self:flex-start;padding-top:160px}
.dp{font-size:1.78rem;letter-spacing:.15em;color:#555;margin-left:12px;align-self:flex-start;padding-top:160px}
.nm{font-size:5.44rem;font-weight:700;letter-spacing:.35em;margin-left:40px;margin-right:10px;align-self:center;white-space:nowrap}
.ad{font-size:1.66rem;line-height:1.55;margin-left:6px;color:#333;align-self:flex-start}
.ad .alab{color:#c4561d}
.ph{font-size:1.66rem;line-height:1.55;color:#333;align-self:inherit;text-orientation:upright;letter-spacing:-.05em;}
.cg{display:flex;flex-direction:column;align-self:stretch;justify-content:flex-start}
.cg>div{align-self:flex-start}
.ex{font-size:1.44rem;color:#999;letter-spacing:.1em;align-self:flex-start;padding-top:40px}
.foot{position:absolute;left:46px;bottom:36px;display:flex;align-items:flex-end;gap:14px}

</style></head><body><div class="card fit"><div class="vr fit"><div class="co">新禾科技股份有限公司</div><div class="tt">資深軟體工程師</div><div class="nm">李承恩</div><div class="cg"><div class="ad">台灣 114 台北市內湖區瑞光路35號8樓</div><div class="ph">行動電話：0900 773 729</div><div class="ad">信箱：elee@xinhetech.com.tw</div><div class="ad">www.xinhetech.com.tw</div></div></div><div class="foot"><div class="logo" style="display:flex;flex-direction:row;align-items:center;gap:12px"><svg width="70" height="70" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="4" width="92" height="92" rx="8" fill="#b3261e"/><rect x="11" y="11" width="78" height="78" rx="4" fill="none" stroke="#ffffff" stroke-width="3"/><text x="50" y="63" font-size="38" text-anchor="middle" fill="#ffffff" font-weight="700" font-family="Noto Serif CJK TC, Noto Sans CJK TC, Liberation Sans">新禾</text></svg><span class="wm" style="font-size:2.2rem;color:#c4561d;font-family:'Liberation Sans','DejaVu Sans','Noto Sans CJK TC',sans-serif;font-weight:700;letter-spacing:.06em;white-space:nowrap">XINHE</span></div></div></div>
<script>
window.__fit = function(){
  const root = document.documentElement; let s = 1.0;
  const els = Array.from(document.querySelectorAll('.fit'));
  const over = () => els.some(el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
  while (over() && s > 0.5) { s = Math.round((s - 0.03) * 100) / 100; root.style.setProperty('--s', s); }
  return s;
};
</script></body></html>
