</style></head><body><div class="card fit"><div><div class="logo" style="display:flex;flex-direction:column;align-items:center;gap:19px"><svg width="110" height="110" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="4" width="92" height="92" rx="8" fill="#b3261e"/><rect x="11" y="11" width="78" height="78" rx="4" fill="none" stroke="#ffffff" stroke-width="3"/><text x="50" y="63" font-size="38" text-anchor="middle" fill="#ffffff" font-weight="700" font-family="Noto Serif CJK TC, Noto Sans CJK TC, Liberation Sans">云帆</text></svg><span class="wm" style="font-size:2.8rem;color:#8a1c2b;font-family:'Noto Serif CJK SC','Liberation Serif',serif;font-weight:700;letter-spacing:.06em;white-space:nowrap">CloudSail</span></div><div class="co">北京云帆软件有限公司</div></div><div><div class="nm">李娜</div><div class="tt">创始人兼首席执行官</div></div><div><div class="ct"><div class="ln">手机：+86 158 0921 4136</div><div class="ln">lina@yunfansoft.cn</div><div class="ln">网址：https://www.yunfansoft.cn</div><div class="ln">微信：lina95</div></div><div class="addr"><div>北京市朝阳区建国路93号1203室（100022）</div></div><div class="ex">科技创新 引领未来</div></div></div>
<script>
window.__fit = function(){
  const root = document.documentElement; let s = 1.0;
  const els = Array.from(document.querySelectorAll('.fit'));
  const over = () => els.some(el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
  while (over() && s > 0.5) { s = Math.round((s - 0.03) * 100) / 100; root.style.setProperty('--s', s); }
  return s;
};
</script></body></html>
