</style></head><body><div class="card"><div class="l fit"><div><div class="logo" style="display:flex;flex-direction:row;align-items:center;gap:15px"><svg width="84" height="84" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="4" width="92" height="92" rx="8" fill="#b3261e"/><rect x="11" y="11" width="78" height="78" rx="4" fill="none" stroke="#ffffff" stroke-width="3"/><text x="50" y="63" font-size="38" text-anchor="middle" fill="#ffffff" font-weight="700" font-family="Noto Serif CJK TC, Noto Sans CJK TC, Liberation Sans">港信</text></svg><span class="wm" style="font-size:2.4rem;color:#c5a467;font-family:'Noto Serif CJK TC','Liberation Serif',serif;font-weight:700;letter-spacing:.06em;white-space:nowrap">HARBOUR TRUST</span></div></div><div><div class="nm">林曉彤</div><div class="tt">財務長</div></div><div><div class="co">港信會計師事務所有限公司</div></div></div><div class="r fit"><div class="ct"><div class="ln">電話：+852 2560 7397 轉 751</div><div class="ln">karen.lam@harbourtrustcpa.com.hk</div><div class="ln">https://www.harbourtrustcpa.com.hk</div><div class="ln">微信：karenlam21</div></div><div class="addr"><div>香港中環德輔道中88號景豐大廈22樓2208室</div></div><div style="display:flex;gap:16px;align-items:center"><div><div class="ex">誠信 穩健 專業</div><div class="ex">ISO 27001</div></div></div></div></div>
<script>
window.__fit = function(){
  const root = document.documentElement; let s = 1.0;
  const els = Array.from(document.querySelectorAll('.fit'));
  const over = () => els.some(el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
  while (over() && s > 0.5) { s = Math.round((s - 0.03) * 100) / 100; root.style.setProperty('--s', s); }
  return s;
};
