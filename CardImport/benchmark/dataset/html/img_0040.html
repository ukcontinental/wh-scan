<!doctype html><html lang="en"><head><meta charset="utf-8">
<style>
:root{--s:1}
html{font-size:calc(10px * var(--s))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1050px;height:600px;overflow:hidden;background:#fff}
body{font-family:'Liberation Sans','DejaVu Sans','Noto Sans CJK TC',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.card{width:1050px;height:600px;overflow:hidden;position:relative}
.ln{white-space:nowrap}

.card{background:#ffffff;color:#2a2a2a;padding:56px 64px;display:flex;flex-direction:column;gap:22px;justify-content:center}
.co{font-size:2.5rem;font-weight:700;color:#6a2c8a}
.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;overflow:hidden}
.addr{font-size:2.1rem;line-height:1.38} .addr+.addr{margin-top:16px} .alab{font-weight:700;color:#6a2c8a;font-size:1.9rem;letter-spacing:.05em}
.ct{font-size:2.2rem;line-height:1.5}

</style></head><body><div class="card fit"><div><div class="logo" style="display:flex;flex-direction:row;align-items:center;gap:11px"><svg width="64" height="64" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><polygon points="50,3 93,27 93,73 50,97 7,73 7,27" fill="#6a2c8a"/><polygon points="50,22 76,37 76,63 50,78 24,63 24,37" fill="none" stroke="#ffffff" stroke-width="6"/></svg></div></div><div class="grid fit"><div><div class="addr"><div class="alab">Head Office</div><div>4321 Still Creek Dr, Unit 110</div><div>Burnaby, BC V5C 6S7</div><div>Canada</div></div><div class="addr"><div class="alab">Warehouse &amp; Distribution</div><div>1055 W Georgia St, Suite 2100</div><div>Vancouver, BC V6E 3P3</div><div>Canada</div></div></div><div class="ct"><div class="ln">Office: 604.555.0175</div><div class="ln">Fax: +1 604 555 0109</div><div class="ln">service@northstarcoldchain.com</div><div class="ln">northstarcoldchain.com</div></div></div></div>
<script>
window.__fit = function(){
  const root = document.documentElement; let s = 1.0;
  const els = Array.from(document.querySelectorAll('.fit'));
  const over = () => els.some(el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
  while (over() && s > 0.5) { s = Math.round((s - 0.03) * 100) / 100; root.style.setProperty('--s', s); }
  return s;
};
</script></body></html>
