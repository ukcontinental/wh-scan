<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<style>
:root{--s:1}
html{font-size:calc(10px * var(--s))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1050px;height:600px;overflow:hidden;background:#fff}
body{font-family:'Noto Sans CJK SC','WenQuanYi Zen Hei','Liberation Sans',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.card{width:1050px;height:600px;overflow:hidden;position:relative}
.ln{white-space:nowrap}

.card{background:#386641;color:#f5f5f5;padding:56px 64px;display:flex;flex-direction:column;gap:22px;justify-content:center}
.co{font-size:2.5rem;font-weight:700;color:#ffffff}
.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;overflow:hidden}
.addr{font-size:2.1rem;line-height:1.38} .addr+.addr{margin-top:16px} .alab{font-weight:700;color:#ffffff;font-size:1.9rem;letter-spacing:.05em}
.ct{font-size:2.2rem;line-height:1.5}

</style></head><body><div class="card fit"><div style="display:flex;align-items:center;gap:18px"><div class="logo" style="display:flex;flex-direction:row;align-items:center;gap:11px"><svg width="64" height="64" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="4" width="92" height="92" rx="8" fill="#ffffff"/><rect x="11" y="11" width="78" height="78" rx="4" fill="none" stroke="#386641" stroke-width="3"/><text x="50" y="63" font-size="38" text-anchor="middle" fill="#386641" font-weight="700" font-family="Noto Serif CJK TC, Noto Sans CJK TC, Liberation Sans">瑞达</text></svg></div><div class="co">苏州瑞达包装材料有限公司</div></div><div class="grid fit"><div><div class="addr"><div class="alab">总部</div><div>江苏省苏州市苏州工业园区苏虹东路58号（215021）</div></div><div class="addr"><div class="alab">工厂</div><div>上海市浦东新区张江路88号3号楼501室（200120）</div></div></div><div class="ct"><div class="ln">总机：+86-512-82293571</div><div class="ln">FAX：0512-61109545</div><div class="ln">orders@ruidapack.com.cn</div><div class="ln">chenjing@ruidapack.com.cn</div><div class="ln">www.ruidapack.com.cn</div></div></div></div>
<script>
window.__fit = function(){
  const root = document.documentElement; let s = 1.0;
  const els = Array.from(document.querySelectorAll('.fit'));
  const over = () => els.some(el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
  while (over() && s > 0.5) { s = Math.round((s - 0.03) * 100) / 100; root.style.setProperty('--s', s); }
  return s;
};
</script></body></html>
