<!doctype html><html lang="zh-TW"><head><meta charset="utf-8">
<style>
:root{--s:1}
html{font-size:calc(10px * var(--s))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:600px;height:1050px;overflow:hidden;background:#fff}
body{font-family:'Noto Sans CJK TC','WenQuanYi Zen Hei','Liberation Sans',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.card{width:600px;height:1050px;overflow:hidden;position:relative}
.ln{white-space:nowrap}

.card{background:#c4561d;color:#f5f5f5;padding:70px 50px;display:flex;flex-direction:column;gap:22px;justify-content:center}
.co{font-size:2.5rem;font-weight:700;color:#ffffff}
.grid{display:flex;flex-direction:column;gap:22px;overflow:hidden}
.addr{font-size:2.1rem;line-height:1.38} .addr+.addr{margin-top:16px} .alab{font-weight:700;color:#ffffff;font-size:1.9rem;letter-spacing:.05em}
.ct{font-size:2.2rem;line-height:1.5}

</style></head><body><div class="card fit"><div><div class="logo" style="display:flex;flex-direction:row;align-items:center;gap:11px"><svg width="64" height="64" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="4" width="92" height="92" rx="8" fill="#ffffff"/><rect x="11" y="11" width="78" height="78" rx="4" fill="none" stroke="#c4561d" stroke-width="3"/><text x="50" y="63" font-size="38" text-anchor="middle" fill="#c4561d" font-weight="700" font-family="Noto Serif CJK TC, Noto Sans CJK TC, Liberation Sans">新禾</text></svg></div></div><div class="grid fit"><div><div class="addr"><div class="alab">總公司</div><div>台灣 114 台北市內湖區瑞光路35號8樓</div></div><div class="addr"><div class="alab">工廠</div><div>台灣 407 台中市西屯區台灣大道三段99號8樓</div></div></div><div class="ct"><div class="ln">代表號：+886 2 2962 9293</div><div class="ln">傳真：+886 2 2281 6339</div><div class="ln">service@xinhetech.com.tw</div><div class="ln">www.xinhetech.com.tw</div></div></div></div>
<script>
window.__fit = function(){
  const root = document.documentElement; let s = 1.0;
  const els = Array.from(document.querySelectorAll('.fit'));
  const over = () => els.some(el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
  while (over() && s > 0.5) { s = Math.round((s - 0.03) * 100) / 100; root.style.setProperty('--s', s); }
  return s;
};
</script></body></html>
