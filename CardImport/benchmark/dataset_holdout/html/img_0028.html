<!doctype html><html lang="zh-TW"><head><meta charset="utf-8">
<style>
:root{--s:1}
html{font-size:calc(10px * var(--s))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1050px;height:600px;overflow:hidden;background:#fff}
body{font-family:'Noto Sans CJK TC','WenQuanYi Zen Hei','Liberation Sans',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.card{width:1050px;height:600px;overflow:hidden;position:relative}
.ln{white-space:nowrap}

.card{background:#faf8f3;color:#2b2b2b;padding:46px 60px 40px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center}
.hd{width:100%;display:flex;justify-content:space-between;align-items:flex-start}
.co{font-size:2.00rem;letter-spacing:.2em;color:#555;text-align:left} .co2{font-size:1.60rem;color:#888;text-align:left}
.tt{font-size:1.90rem;letter-spacing:.25em;color:#666} .tt2,.dp{font-size:1.70rem;color:#888;letter-spacing:.1em}
.nm{font-family:'Noto Serif CJK TC','Liberation Serif',serif;font-style:normal;font-size:5.60rem;letter-spacing:.3em;margin:8px 0 2px;white-space:nowrap;font-weight:400}
.nm2{font-size:2.20rem;letter-spacing:.2em;color:#666;white-space:nowrap}
.ft{font-size:1.65rem;color:#555;line-height:1.6}
.ft .row{white-space:nowrap}
.ex{font-size:1.45rem;color:#999;letter-spacing:.1em}

</style></head><body><div class="card fit"><div class="hd"><div><div class="co">合邦商業銀行</div></div><div class="logo" style="display:flex;flex-direction:row;align-items:center;gap:11px"><svg width="64" height="64" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="4" width="92" height="92" rx="8" fill="#b3261e"/><rect x="11" y="11" width="78" height="78" rx="4" fill="none" stroke="#ffffff" stroke-width="3"/><text x="50" y="63" font-size="38" text-anchor="middle" fill="#ffffff" font-weight="700" font-family="Noto Serif CJK TC, Noto Sans CJK TC, Liberation Sans">合邦</text></svg></div></div><div><div class="tt">副總裁</div><div class="nm">曾冠宇</div></div><div class="ex">HEBANG BANK</div><div class="ft"><div class="row">台灣 104 台北市中山區南京東路二段88號12樓</div><div class="row">行動電話：0999-720-265 ｜ E-mail：leo.tseng@hebangbank.com.tw</div><div class="row">https://www.hebangbank.com.tw</div></div></div>
<script>
window.__fit = function(){
  const root = document.documentElement; let s = 1.0;
  const els = Array.from(document.querySelectorAll('.fit'));
  const over = () => els.some(el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
  while (over() && s > 0.5) { s = Math.round((s - 0.03) * 100) / 100; root.style.setProperty('--s', s); }
  return s;
};
</script></body></html>
