<!doctype html><html lang="zh-TW"><head><meta charset="utf-8">
<style>
:root{--s:1}
html{font-size:calc(10px * var(--s))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1050px;height:600px;overflow:hidden;background:#fff}
body{font-family:'Noto Sans CJK TC','WenQuanYi Zen Hei','Liberation Sans',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.card{width:1050px;height:600px;overflow:hidden;position:relative}
.ln{white-space:nowrap}

.card{background:#fff;padding:44px 56px 40px;display:flex;flex-direction:column;gap:18px}
.hd{display:flex;align-items:center;gap:20px;border-bottom:3px solid #a12a5e;padding-bottom:14px}
.hc{font-size:2.30rem;font-weight:700;color:#a12a5e;white-space:nowrap} .he{font-size:1.66rem;color:#555;white-space:nowrap}
.cols{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:34px;overflow:hidden}
.col{overflow:hidden} .col+.col{border-left:1px solid #ddd;padding-left:34px}
.nm{font-size:4.05rem;font-weight:700;white-space:nowrap}
.tt{font-size:2.02rem;color:#a12a5e;white-space:nowrap;margin-top:4px}
.dp{font-size:1.75rem;color:#666;white-space:nowrap}
.addr{font-size:1.66rem;color:#444;line-height:1.3;margin-top:10px} .alab{font-weight:700}
.ft{font-size:1.84rem;color:#333;display:flex;flex-wrap:wrap;column-gap:30px;row-gap:2px}
.ex{font-size:1.47rem;color:#999}

</style></head><body><div class="card fit"><div class="hd"><div class="logo" style="display:flex;flex-direction:row;align-items:center;gap:13px"><svg width="74" height="74" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="22" y="22" width="48" height="48" transform="rotate(45 46 46)" fill="#a12a5e"/><rect x="34" y="34" width="48" height="48" transform="rotate(45 58 58)" fill="#c4561d" opacity=".8"/></svg></div><div><div class="hc" style="font-family:'Noto Sans CJK TC','WenQuanYi Zen Hei','Liberation Sans',sans-serif">港信會計師事務所有限公司</div><div class="he">Harbour Trust CPA Limited</div></div><div style="margin-left:auto;text-align:right"><div class="ex">Est. 1962</div></div></div><div class="cols"><div class="col fit" style="font-family:'Noto Sans CJK TC','WenQuanYi Zen Hei','Liberation Sans',sans-serif"><div class="nm">林 曉 彤</div><div class="tt">財務長</div><div class="dp">財富管理部  Wealth Management</div></div><div class="col fit"><div class="nm">Karen Lam, CPA</div><div class="tt">Chief Financial Officer</div><div class="addr"><div>Room 2208, 22/F, Kingsfield Tower, 88 Des Voeux Road Central</div><div>Central, Hong Kong</div></div></div></div><div class="ft fit"><span class="ln">M 手機 (852) 9606 3732</span><span class="ln">電郵 Email: karen_lam@harbourtrustcpa.com.hk</span><span class="ln">www.harbourtrustcpa.com.hk</span></div></div>
<script>
window.__fit = function(){
  const root = document.documentElement; let s = 1.0;
  const els = Array.from(document.querySelectorAll('.fit'));
  const over = () => els.some(el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
  while (over() && s > 0.5) { s = Math.round((s - 0.03) * 100) / 100; root.style.setProperty('--s', s); }
  return s;
};
</script></body></html>
