<!doctype html><html lang="en"><head><meta charset="utf-8">
<style>
:root{--s:1}
html{font-size:calc(10px * var(--s))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1050px;height:600px;overflow:hidden;background:#fff}
body{font-family:'Liberation Sans','DejaVu Sans','Noto Sans CJK TC',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.card{width:1050px;height:600px;overflow:hidden;position:relative}
.ln{white-space:nowrap}

.card{background:linear-gradient(135deg,#111827,#1f2937);color:#f1f5f9;padding:54px 60px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;gap:26px}
.nm{font-size:4.56rem;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.nm2{font-size:2.47rem;opacity:.8;white-space:nowrap}
.tt{font-size:2.09rem;color:#f472b6;margin-top:6px;white-space:nowrap} .tt2,.dp{font-size:1.80rem;opacity:.75;white-space:nowrap}
.mid{display:flex;justify-content:space-between;align-items:flex-end;gap:30px}
.ct{font-family:'DejaVu Sans Mono','Noto Sans Mono CJK TC',monospace;font-size:1.85rem;line-height:1.55}
.ct .ln::before{content:'›  ';color:#f472b6}
.addr{font-size:1.71rem;opacity:.85;line-height:1.3;margin-top:8px} .alab{color:#f472b6}
.co{font-size:1.90rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#f472b6}
.co2{font-size:1.61rem;opacity:.8}
.ex{font-size:1.52rem;opacity:.7}

</style></head><body><div class="card fit"><div class="top"><svg width="130" height="130" viewBox="0 0 100 100" style="border-radius:50%;flex:none"><defs><radialGradient id="ag" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#ffffff" stop-opacity=".45"/><stop offset="1" stop-color="#00798c"/></radialGradient></defs><rect width="100" height="100" fill="url(#ag)"/><rect width="100" height="100" fill="#00798c" opacity=".55"/><circle cx="50" cy="40" r="19" fill="#f1d3b8"/><path d="M50 18 C34 18 30 30 31 40 C36 30 60 28 69 38 C70 26 64 18 50 18Z" fill="#3a2a20"/><path d="M14 100 C16 72 32 64 50 64 C68 64 84 72 86 100Z" fill="#2f3b4f"/><path d="M42 64 L50 78 L58 64Z" fill="#ffffff"/></svg><div><div class="nm">Michelle Ng</div><div class="tt">General Manager</div></div></div><div class="mid"><div><div class="ct"><div class="ln">Cell: 905 555 0138</div><div class="ln">E: michelle.ng@cedarline.ca</div><div class="ln">www.cedarline.ca</div></div><div class="addr"><div>6750 Mississauga Rd, Unit 7</div><div>Mississauga, ON L5N 2L3</div><div>Canada</div></div></div></div><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:20px"><div><div class="co">Cedarline Logistics Inc.</div></div><div style="text-align:right"><div class="ex">Established 2011</div></div></div></div>
<script>
window.__fit = function(){
  const root = document.documentElement; let s = 1.0;
  const els = Array.from(document.querySelectorAll('.fit'));
  const over = () => els.some(el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
  while (over() && s > 0.5) { s = Math.round((s - 0.03) * 100) / 100; root.style.setProperty('--s', s); }
  return s;
};
</script></body></html>
