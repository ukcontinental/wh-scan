</style></head><body><div class="card"><div class="band fit"><div class="logo" style="display:flex;flex-direction:column;align-items:center;gap:19px"><svg width="110" height="110" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="47" fill="#ffffff"/><text x="50" y="64" font-size="40" font-weight="700" text-anchor="middle" fill="#b8860b" font-family="Liberation Sans">KL</text></svg><span class="wm" style="font-size:3.0rem;color:#ffffff;font-family:'Liberation Sans','DejaVu Sans','Noto Sans CJK TC',sans-serif;font-weight:700;letter-spacing:.06em;white-space:nowrap">KB LOGISTICS</span></div><div><div class="bco">九龍灣物流有限公司</div><div class="bco2">Kowloon Bay Logistics Ltd.</div></div></div><div class="main fit"><div style="display:flex;gap:22px;align-items:center"><div><div class="nm">張美儀</div><div class="nm2">Winnie Cheung</div></div></div><div><div class="tt">物流專員</div><div class="tt2">Logistics Coordinator</div></div><div class="rule"></div><div style="display:flex;gap:24px;align-items:flex-end;justify-content:space-between"><div><div class="ct"><div class="ln">T 電話 +852-2078-5414 轉 111</div><div class="ln">電郵 Email: wcheung@kblogistics.com.hk</div><div class="ln">網址：https://www.kblogistics.com.hk</div><div class="ln">微信 WeChat: winniecheung68</div></div><div class="addr"><div>九龍觀塘鴻圖道12號永發工業大廈9樓B室</div></div><div class="ex">HACCP</div></div></div></div></div>
<script>
window.__fit = function(){
  const root = document.documentElement; let s = 1.0;
  const els = Array.from(document.querySelectorAll('.fit'));
  const over = () => els.some(el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
  while (over() && s > 0.5) { s = Math.round((s - 0.03) * 100) / 100; root.style.setProperty('--s', s); }
  return s;
};
