<!doctype html><html lang="en"><head><meta charset="utf-8">
<style>
:root{--s:1}
html{font-size:calc(10px * var(--s))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1050px;height:600px;overflow:hidden;background:#fff}
body{font-family:'Liberation Sans','DejaVu Sans','Noto Sans CJK TC',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.card{width:1050px;height:600px;overflow:hidden;position:relative}
.ln{white-space:nowrap}

.card{background:#fff;padding:58px 70px 52px 74px;display:flex;flex-direction:column;justify-content:space-between;color:#222}
.top{display:flex;align-items:center;justify-content:space-between;gap:24px}
.co{font-size:2.50rem;font-weight:700;color:#00798c;letter-spacing:.03em}
.co2{font-size:1.90rem;color:#666;margin-top:4px}
.nm{font-size:5.60rem;font-weight:700;font-style:normal;line-height:1.15;white-space:nowrap}
.nm2{font-size:3.00rem;color:#444;margin-top:2px;white-space:nowrap}
.tt{font-size:2.60rem;color:#00798c;margin-top:10px;white-space:nowrap}
.tt2,.dp{font-size:2.20rem;color:#666;margin-top:3px;white-space:nowrap}
.bot{display:flex;justify-content:space-between;align-items:flex-end;gap:30px}
.ct{font-size:2.30rem;line-height:1.42;color:#333}
.ad{font-size:2.10rem;line-height:1.35;color:#444;text-align:right;max-width:470px}
.addr+.addr{margin-top:8px} .alab{font-weight:700;color:#00798c}
.ex{font-size:1.80rem;color:#888;font-style:italic;margin-top:6px}

</style></head><body><div class="card fit"><div class="top"><div><div class="co">Chan &amp; Chan Trading Ltd.</div></div><div style="display:flex;gap:18px;align-items:center"><div class="logo" style="display:flex;flex-direction:row;align-items:center;gap:16px"><svg width="92" height="92" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="44" fill="none" stroke="#00798c" stroke-width="7"/><ellipse cx="50" cy="50" rx="18" ry="44" fill="none" stroke="#00798c" stroke-width="5"/><line x1="6" y1="50" x2="94" y2="50" stroke="#1d6b5f" stroke-width="5"/><line x1="14" y1="30" x2="86" y2="30" stroke="#00798c" stroke-width="4"/><line x1="14" y1="70" x2="86" y2="70" stroke="#00798c" stroke-width="4"/></svg></div></div></div><div><div class="nm">Victoria Chan</div><div class="tt">Vice President, Sales</div><div class="dp">Import &amp; Export Dept.</div></div><div class="bot"><div class="ct"><div class="ln">M: (852) 5664 8034</div><div class="ln">Email: victoria@chanandchan.com.hk</div><div class="ln">www.chanandchan.com.hk</div></div><div style="display:flex;gap:20px;align-items:flex-end"><div class="ad"><div class="addr"><div>Unit 1503, 15/F, Harbour Crest Centre, 30 Canton Road, Tsim Sha Tsui</div><div>Kowloon, Hong Kong</div></div><div class="ex">Global Sourcing, Local Service</div></div></div></div></div>
<script>
window.__fit = function(){
  const root = document.documentElement; let s = 1.0;
  const els = Array.from(document.querySelectorAll('.fit'));
  const over = () => els.some(el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
  while (over() && s > 0.5) { s = Math.round((s - 0.03) * 100) / 100; root.style.setProperty('--s', s); }
  return s;
};
</script></body></html>
