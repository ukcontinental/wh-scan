.ex{font-size:1.61rem;color:#999;margin-top:6px;padding:0 30px}

</style></head><body><div class="card fit"><div class="hdr"><div class="logo" style="display:flex;flex-direction:column;align-items:center;gap:17px"><svg width="96" height="96" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="47" fill="#ffffff"/><text x="50" y="64" font-size="40" font-weight="700" text-anchor="middle" fill="#8a1c2b" font-family="Liberation Sans">WT</text></svg><span class="wm" style="font-size:2.6rem;color:#ffffff;font-family:'Liberation Sans','DejaVu Sans','Noto Sans CJK TC',sans-serif;font-weight:700;letter-spacing:.06em;white-space:nowrap">GOLDEN BOWL</span></div><div class="hco">滙泰食品有限公司</div><div class="co2">Wui Tai Foods Limited</div></div><div style="height:20px"></div><div class="nm">梁家輝</div><div class="nm2">Patrick Leung</div><div class="tt">外銷經理</div><div class="tt2">Export Manager</div><div class="rule"></div><div class="grow"></div><div class="ct"><div class="ln">T 電話 2627 3144</div><div class="ln">電郵 Email: patrick_leung@wuitaifoods.com.hk</div><div class="ln">https://www.wuitaifoods.com.hk</div></div><div class="addr"><div>Flat B, 9/F, Wing Fat Industrial Building, 12 Hung To Road, Kwun Tong</div><div>Kowloon</div></div><div class="ex">Your Trusted Partner in Frozen Foods</div><div class="grow"></div></div>
<script>
window.__fit = function(){
  const root = document.documentElement; let s = 1.0;
  const els = Array.from(document.querySelectorAll('.fit'));
  const over = () => els.some(el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
  while (over() && s > 0.5) { s = Math.round((s - 0.03) * 100) / 100; root.style.setProperty('--s', s); }
  return s;
};
</script></body></html>
