<!doctype html><html lang="en"><head><meta charset="utf-8">
<style>
:root{--s:1}
html{font-size:calc(10px * var(--s))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1050px;height:600px;overflow:hidden;background:#fff}
body{font-family:'Liberation Sans','DejaVu Sans','Noto Sans CJK TC',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.card{width:1050px;height:600px;overflow:hidden;position:relative}
.ln{white-space:nowrap}

.card{background:#1d6b5f;color:#f5f5f5;padding:56px 64px;display:flex;flex-direction:column;gap:22px;justify-content:center}
.co{font-size:2.5rem;font-weight:700;color:#ffffff}
.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;overflow:hidden}
.addr{font-size:2.1rem;line-height:1.38} .addr+.addr{margin-top:16px} .alab{font-weight:700;color:#ffffff;font-size:1.9rem;letter-spacing:.05em}
.ct{font-size:2.2rem;line-height:1.5}

</style></head><body><div class="card fit"><div><div class="logo" style="display:flex;flex-direction:row;align-items:center;gap:11px"><svg width="64" height="64" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="70" width="17" height="24" fill="#ffffff"/><rect x="31" y="52" width="17" height="42" fill="rgba(255,255,255,.65)"/><rect x="54" y="34" width="17" height="60" fill="#ffffff"/><rect x="77" y="16" width="17" height="78" fill="rgba(255,255,255,.65)"/></svg></div></div><div class="grid fit"><div><div class="addr"><div class="alab">Head Office</div><div>333 Bay St, 18th Floor</div><div>Toronto, ON M5H 2R2</div><div>Canada</div></div><div class="addr"><div class="alab">Warehouse &amp; Distribution</div><div>1055 W Georgia St, Suite 2100</div><div>Vancouver, BC V6E 3P3</div><div>Canada</div></div></div><div class="ct"><div class="ln">Office: +1 647 555 0134</div><div class="ln">F +1-647-555-0118</div><div class="ln">Direct: (647) 555-0102 Ext 31</div><div class="ln">info@granitepeakcap.ca</div><div class="ln">sophie.lam@granitepeakcap.ca</div></div></div></div>
<script>
window.__fit = function(){
  const root = document.documentElement; let s = 1.0;
  const els = Array.from(document.querySelectorAll('.fit'));
  const over = () => els.some(el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
  while (over() && s > 0.5) { s = Math.round((s - 0.03) * 100) / 100; root.style.setProperty('--s', s); }
  return s;
};
</script></body></html>
