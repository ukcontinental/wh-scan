<!doctype html><html lang="en"><head><meta charset="utf-8">
<style>
:root{--s:1}
html{font-size:calc(10px * var(--s))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1050px;height:600px;overflow:hidden;background:#fff}
body{font-family:'Liberation Sans','DejaVu Sans','Noto Sans CJK TC',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.card{width:1050px;height:600px;overflow:hidden;position:relative}
.ln{white-space:nowrap}

.card{background:#0d1b2a;color:#e8e6df;display:grid;grid-template-columns:1.05fr 1fr;padding:60px 64px}
.l{display:flex;flex-direction:column;justify-content:space-between;padding-right:40px;border-right:2px solid #c9a227;overflow:hidden}
.r{display:flex;flex-direction:column;justify-content:center;padding-left:44px;gap:14px;overflow:hidden}
.nm{font-family:'Liberation Serif','DejaVu Serif','Noto Serif CJK TC',serif;font-style:normal;font-size:5.00rem;color:#c9a227;line-height:1.15;white-space:nowrap}
.nm2{font-family:'Liberation Serif','DejaVu Serif','Noto Serif CJK TC',serif;font-size:2.80rem;color:#c9a227;opacity:.85;white-space:nowrap}
.tt{font-size:2.30rem;letter-spacing:.12em;text-transform:uppercase;margin-top:12px;white-space:nowrap}
.tt2,.dp{font-size:2.10rem;opacity:.8;margin-top:4px;white-space:nowrap}
.co{font-family:'Liberation Serif','DejaVu Serif','Noto Serif CJK TC',serif;font-size:2.40rem;color:#c9a227;letter-spacing:.05em}
.co2{font-size:1.80rem;opacity:.8}
.ct{font-size:2.20rem;line-height:1.45}
.addr{font-size:2.00rem;line-height:1.35;opacity:.92} .alab{color:#c9a227}
.ex{font-size:1.70rem;color:#c9a227;opacity:.8;letter-spacing:.08em}

</style></head><body><div class="card"><div class="l fit"><div><div class="logo" style="display:flex;flex-direction:row;align-items:center;gap:15px"><svg width="84" height="84" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="47" fill="#c9a227"/><text x="50" y="64" font-size="40" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Liberation Sans">M</text></svg></div></div><div><div class="nm">Morgan Lee</div><div class="tt">Partner</div></div><div><div class="co">Morgan Consulting Group</div></div></div><div class="r fit"><div class="ct"><div class="ln">M +1-416-555-0128</div><div class="ln">P: +1 416 555 0171 ext 504</div><div class="ln">Fax: 416 555 0158</div><div class="ln">Email: morgan_lee@morganconsulting.ca</div><div class="ln">www.morganconsulting.ca</div></div><div class="addr"><div>120 Front St W, Suite 400</div><div>Toronto, ON M5J 2M2</div><div>Canada</div></div><div style="display:flex;gap:16px;align-items:center"><div><div class="ex">Advice that Moves You Forward</div></div></div></div></div>
<script>
window.__fit = function(){
  const root = document.documentElement; let s = 1.0;
  const els = Array.from(document.querySelectorAll('.fit'));
  const over = () => els.some(el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
  while (over() && s > 0.5) { s = Math.round((s - 0.03) * 100) / 100; root.style.setProperty('--s', s); }
  return s;
};
</script></body></html>
