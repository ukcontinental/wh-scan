<!doctype html><html lang="zh-TW"><head><meta charset="utf-8">
<style>
:root{--s:1}
html{font-size:calc(10px * var(--s))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1050px;height:600px;overflow:hidden;background:#fff}
body{font-family:'Noto Sans CJK TC','WenQuanYi Zen Hei','Liberation Sans',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.card{width:1050px;height:600px;overflow:hidden;position:relative}
.ln{white-space:nowrap}

.card{background:#fff;display:grid;grid-template-columns:1.15fr 1fr;padding:50px 56px;gap:40px}
.lg{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;overflow:hidden}
.info{display:flex;flex-direction:column;justify-content:center;gap:10px;overflow:hidden;border-left:2px solid #e3e3e3;padding-left:36px}
.nm{font-size:3.86rem;font-weight:700;font-style:normal;white-space:nowrap}
.nm2{font-size:2.39rem;color:#555;white-space:nowrap}
.tt{font-size:2.02rem;color:#a12a5e;white-space:nowrap} .tt2,.dp{font-size:1.84rem;color:#777;white-space:nowrap}
.co{font-size:1.93rem;font-weight:700;color:#333;margin-top:8px} .co2{font-size:1.66rem;color:#777}
.ct{font-size:1.93rem;line-height:1.4;color:#333;margin-top:8px}
.addr{font-size:1.75rem;line-height:1.3;color:#555} .alab{font-weight:700}
.ex{font-size:1.56rem;color:#a12a5e;text-align:center;letter-spacing:.06em}

</style></head><body><div class="card"><div class="lg fit"><div class="logo" style="display:flex;flex-direction:column;align-items:center;gap:45px"><svg width="250" height="250" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><polyline points="10,15 38,50 10,85" fill="none" stroke="#a12a5e" stroke-width="12"/><polyline points="36,15 64,50 36,85" fill="none" stroke="#00798c" stroke-width="12"/><polyline points="62,15 90,50 62,85" fill="none" stroke="#a12a5e" stroke-width="12"/></svg><span class="wm" style="font-size:4.6rem;color:#a12a5e;font-family:'Liberation Sans','DejaVu Sans','Noto Sans CJK TC',sans-serif;font-weight:700;letter-spacing:.06em;white-space:nowrap">CEDARLINE</span></div><div class="ex">始於2011</div></div><div class="info fit"><div class="nm">吳 美 華</div><div class="tt">總經理</div><div class="co">雪松物流有限公司</div><div class="ct"><div class="ln">手機 +1 905 555 0138</div><div class="ln">信箱：michelle.ng@cedarline.ca</div><div class="ln">www.cedarline.ca</div></div><div class="addr"><div>加拿大安大略省密西沙加密西沙加路6750號7單元</div><div>郵遞區號 L5N 2L3</div></div></div></div>
<script>
window.__fit = function(){
  const root = document.documentElement; let s = 1.0;
  const els = Array.from(document.querySelectorAll('.fit'));
  const over = () => els.some(el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
  while (over() && s > 0.5) { s = Math.round((s - 0.03) * 100) / 100; root.style.setProperty('--s', s); }
  return s;
};
</script></body></html>
