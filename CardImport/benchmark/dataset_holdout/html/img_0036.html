<!doctype html><html lang="en"><head><meta charset="utf-8">
<style>
:root{--s:1}
html{font-size:calc(10px * var(--s))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1050px;height:600px;overflow:hidden;background:#fff}
body{font-family:'Liberation Sans','DejaVu Sans','Noto Sans CJK TC',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.card{width:1050px;height:600px;overflow:hidden;position:relative}
.ln{white-space:nowrap}

.card{background:#fff;display:grid;grid-template-columns:1.15fr 1fr;padding:50px 56px;gap:40px}
.lg{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;overflow:hidden}
.info{display:flex;flex-direction:column;justify-content:center;gap:10px;overflow:hidden;border-left:2px solid #e3e3e3;padding-left:36px}
.nm{font-size:3.86rem;font-weight:700;font-family:'Liberation Serif','Liberation Serif','DejaVu Serif','Noto Serif CJK TC',serif;font-style:italic;white-space:nowrap}
.nm2{font-size:2.39rem;color:#555;white-space:nowrap}
.tt{font-size:2.02rem;color:#a12a5e;white-space:nowrap} .tt2,.dp{font-size:1.84rem;color:#777;white-space:nowrap}
.co{font-size:1.93rem;font-weight:700;color:#333;margin-top:8px} .co2{font-size:1.66rem;color:#777}
.ct{font-size:1.93rem;line-height:1.4;color:#333;margin-top:8px}
.addr{font-size:1.75rem;line-height:1.3;color:#555} .alab{font-weight:700}
.ex{font-size:1.56rem;color:#a12a5e;text-align:center;letter-spacing:.06em}

</style></head><body><div class="card"><div class="lg fit"><div class="logo" style="display:flex;flex-direction:column;align-items:center;gap:45px"><svg width="250" height="250" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="20" cy="20" r="9" fill="#3b5d2a"/><circle cx="50" cy="20" r="11" fill="#a12a5e"/><circle cx="80" cy="20" r="13" fill="#3b5d2a"/><circle cx="20" cy="50" r="10" fill="#3b5d2a"/><circle cx="50" cy="50" r="12" fill="#a12a5e"/><circle cx="80" cy="50" r="9" fill="#3b5d2a"/><circle cx="20" cy="80" r="11" fill="#3b5d2a"/><circle cx="50" cy="80" r="13" fill="#a12a5e"/><circle cx="80" cy="80" r="10" fill="#3b5d2a"/></svg><span class="wm" style="font-size:4.6rem;color:#a12a5e;font-family:'Liberation Sans','DejaVu Sans','Noto Sans CJK TC',sans-serif;font-weight:700;letter-spacing:.06em;white-space:nowrap">XINHE</span></div><div class="ex">ISO 27001</div></div><div class="info fit"><div class="nm">Sandy HUNG</div><div class="tt">Founder &amp; CEO</div><div class="co">Xinhe Technology Inc.</div><div class="ct"><div class="ln">C 0982-141-192</div><div class="ln">Office: +886-2-2682-2359</div><div class="ln">F 886-2-2441-0243</div><div class="ln">Email: sandyh@xinhetech.com.tw</div><div class="ln">xinhetech.com.tw</div></div><div class="addr"><div>8F., No. 35, Ruiguang Rd., Neihu Dist.</div><div>Taipei City 114, Taiwan</div></div></div></div>
<script>
window.__fit = function(){
  const root = document.documentElement; let s = 1.0;
  const els = Array.from(document.querySelectorAll('.fit'));
  const over = () => els.some(el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
  while (over() && s > 0.5) { s = Math.round((s - 0.03) * 100) / 100; root.style.setProperty('--s', s); }
  return s;
};
</script></body></html>
