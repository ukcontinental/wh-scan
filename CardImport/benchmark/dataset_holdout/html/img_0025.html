<!doctype html><html lang="en"><head><meta charset="utf-8">
<style>
:root{--s:1}
html{font-size:calc(10px * var(--s))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1050px;height:600px;overflow:hidden;background:#fff}
body{font-family:'Liberation Sans','DejaVu Sans','Noto Sans CJK TC',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.card{width:1050px;height:600px;overflow:hidden;position:relative}
.ln{white-space:nowrap}

.card{background:linear-gradient(135deg,#0f172a,#312e81);color:#f1f5f9;padding:54px 60px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;gap:26px}
.nm{font-size:4.56rem;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.nm2{font-size:2.47rem;opacity:.8;white-space:nowrap}
.tt{font-size:2.09rem;color:#5eead4;margin-top:6px;white-space:nowrap} .tt2,.dp{font-size:1.80rem;opacity:.75;white-space:nowrap}
.mid{display:flex;justify-content:space-between;align-items:flex-end;gap:30px}
.ct{font-family:'DejaVu Sans Mono','Noto Sans Mono CJK TC',monospace;font-size:1.85rem;line-height:1.55}
.ct .ln::before{content:'›  ';color:#5eead4}
.addr{font-size:1.71rem;opacity:.85;line-height:1.3;margin-top:8px} .alab{color:#5eead4}
.co{font-size:1.90rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#5eead4}
.co2{font-size:1.61rem;opacity:.8}
.ex{font-size:1.52rem;opacity:.7}

</style></head><body><div class="card fit"><div class="top"><svg width="110" height="110" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><ellipse cx="44" cy="50" rx="34" ry="20" fill="#5eead4"/><polygon points="72,50 96,30 96,70" fill="#ffffff"/><circle cx="26" cy="45" r="4" fill="#ffffff"/></svg><div><div class="nm">Justin Tang</div><div class="tt">General Manager</div></div></div><div class="mid"><div><div class="ct"><div class="ln">Mobile: (604) 555-0166</div><div class="ln">T +1-604-555-0131</div><div class="ln">F: +1 604 555 0122</div><div class="ln">E: justint@brightwaterseafood.ca</div><div class="ln">www.brightwaterseafood.ca</div></div><div class="addr"><div>1055 W Georgia St, Suite 2100</div><div>Vancouver, BC V6E 3P3</div></div></div></div><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:20px"><div><div class="co">Brightwater Seafood Inc.</div></div><div style="text-align:right"></div></div></div>
<script>
window.__fit = function(){
  const root = document.documentElement; let s = 1.0;
  const els = Array.from(document.querySelectorAll('.fit'));
  const over = () => els.some(el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
  while (over() && s > 0.5) { s = Math.round((s - 0.03) * 100) / 100; root.style.setProperty('--s', s); }
  return s;
};
</script></body></html>
