.card{width:1050px;height:600px;overflow:hidden;position:relative}
.ln{white-space:nowrap}

.card{background:#faf8f3;color:#2b2b2b;padding:46px 60px 40px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center}

.nm2{font-size:2.20rem;letter-spacing:.2em;color:#666;white-space:nowrap}
.ft{font-size:1.65rem;color:#555;line-height:1.6}
.ft .row{white-space:nowrap}
.ex{font-size:1.45rem;color:#999;letter-spacing:.1em}

</style></head><body><div class="card fit"><div class="hd"><div><div class="co">新禾科技股份有限公司</div></div><div class="logo" style="display:flex;flex-direction:row;align-items:center;gap:11px"><svg width="64" height="64" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="20" cy="20" r="9" fill="#3b5d2a"/><circle cx="50" cy="20" r="11" fill="#a12a5e"/><circle cx="80" cy="20" r="13" fill="#3b5d2a"/><circle cx="20" cy="50" r="10" fill="#3b5d2a"/><circle cx="50" cy="50" r="12" fill="#a12a5e"/><circle cx="80" cy="50" r="9" fill="#3b5d2a"/><circle cx="20" cy="80" r="11" fill="#3b5d2a"/><circle cx="50" cy="80" r="13" fill="#a12a5e"/><circle cx="80" cy="80" r="10" fill="#3b5d2a"/></svg></div></div><div><div class="tt">創辦人暨執行長</div><div class="nm">洪詩涵</div></div><div class="ex">XINHE</div><div class="ft"><div class="row">台灣 114 台北市內湖區瑞光路35號8樓</div><div class="row">行動電話：0982 141 192 ｜ TEL：886-2-2682-2359</div><div class="row">FAX：(02) 2441-0243 ｜ 信箱：sandyh@xinhetech.com.tw</div><div class="row">xinhetech.com.tw</div><div class="ex">ISO 27001</div></div></div>
<script>
window.__fit = function(){
  const root = document.documentElement; let s = 1.0;
  const els = Array.from(document.querySelectorAll('.fit'));
  const over = () => els.some(el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
  while (over() && s > 0.5) { s = Math.round((s - 0.03) * 100) / 100; root.style.setProperty('--s', s); }
  return s;
};
</script></body></html>
