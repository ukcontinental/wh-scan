<!doctype html><html lang="en"><head><meta charset="utf-8">
<style>
:root{--s:1}
html{font-size:calc(10px * var(--s))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:600px;height:1050px;overflow:hidden;background:#fff}
body{font-family:'Liberation Sans','DejaVu Sans','Noto Sans CJK TC',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.card{width:600px;height:1050px;overflow:hidden;position:relative}
.ln{white-space:nowrap}

.card{background:#fff;display:flex;flex-direction:column;align-items:center;text-align:center}
.hdr{width:100%;min-height:250px;background:#9a031e;display:flex;align-items:center;justify-content:center;flex:none;flex-direction:column;gap:10px;color:#fff;padding:24px 0 24px}

.nm{font-size:4.37rem;font-weight:700;margin-top:22px;font-style:normal;white-space:nowrap}
.nm2{font-size:2.47rem;color:#555;white-space:nowrap}
.tt{font-size:2.18rem;color:#9a031e;margin-top:8px;white-space:nowrap} .tt2,.dp{font-size:1.90rem;color:#666;white-space:nowrap}
.rule{width:80px;height:3px;background:#1d6b5f;margin:22px 0}
.ct{font-size:2.04rem;line-height:1.5;color:#333;padding:0 40px}
.addr{font-size:1.85rem;line-height:1.35;color:#555;margin-top:12px;padding:0 44px} .alab{font-weight:700;color:#9a031e}

</style></head><body><div class="card fit"><div class="hdr"><div class="logo" style="display:flex;flex-direction:column;align-items:center;gap:17px"><svg width="96" height="96" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="47" fill="#ffffff"/><text x="50" y="64" font-size="40" font-weight="700" text-anchor="middle" fill="#9a031e" font-family="Liberation Sans">TA</text></svg><span class="wm" style="font-size:2.6rem;color:#ffffff;font-family:'Liberation Sans','DejaVu Sans','Noto Sans CJK TC',sans-serif;font-weight:700;letter-spacing:.06em;white-space:nowrap">TJ&amp;A</span></div><div class="hco">Taylor Jordan &amp; Associates LLP</div></div><div style="height:20px"></div><div class="nm">Jordan Taylor</div><div class="tt">Senior Consultant</div><div class="dp">Strategy Practice</div><div class="rule"></div><div class="grow"></div><div class="ct"><div class="ln">M 212-555-0156</div><div class="ln">E jordant@taylorjordanlaw.com</div><div class="ln">Web: www.taylorjordanlaw.com</div></div><div class="addr"><div>420 Madison Ave, Suite 1201</div><div>New York, NY 10017</div></div><div class="grow"></div></div>
<script>
window.__fit = function(){
  const root = document.documentElement; let s = 1.0;
  const els = Array.from(document.querySelectorAll('.fit'));
  const over = () => els.some(el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
  while (over() && s > 0.5) { s = Math.round((s - 0.03) * 100) / 100; root.style.setProperty('--s', s); }
  return s;
};
</script></body></html>
