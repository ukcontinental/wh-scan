<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<style>
:root{--s:1}
html{font-size:calc(10px * var(--s))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1050px;height:600px;overflow:hidden;background:#fff}
body{font-family:'Noto Sans CJK SC','WenQuanYi Zen Hei','Liberation Sans',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.card{width:1050px;height:600px;overflow:hidden;position:relative}
.ln{white-space:nowrap}

.card{background:#fff;border-top:14px solid #6a2c8a;padding:58px 70px 52px 74px;display:flex;flex-direction:column;justify-content:space-between;color:#222}
.top{display:flex;align-items:center;justify-content:space-between;gap:24px}
.co{font-size:2.50rem;font-weight:700;color:#6a2c8a;letter-spacing:.03em}
.co2{font-size:1.90rem;color:#666;margin-top:4px}
.nm{font-size:5.60rem;font-weight:700;font-style:normal;line-height:1.15;white-space:nowrap}
.nm2{font-size:3.00rem;color:#444;margin-top:2px;white-space:nowrap}
.tt{font-size:2.60rem;color:#6a2c8a;margin-top:10px;white-space:nowrap}
.tt2,.dp{font-size:2.20rem;color:#666;margin-top:3px;white-space:nowrap}
.bot{display:flex;justify-content:space-between;align-items:flex-end;gap:30px}
.ct{font-size:2.30rem;line-height:1.42;color:#333}
.ad{font-size:2.10rem;line-height:1.35;color:#444;text-align:right;max-width:470px}
.addr+.addr{margin-top:8px} .alab{font-weight:700;color:#6a2c8a}
.ex{font-size:1.80rem;color:#888;font-style:italic;margin-top:6px}

</style></head><body><div class="card fit"><div class="top"><div><div class="co">广州恒泰进出口贸易有限公司</div></div><div style="display:flex;gap:18px;align-items:center"><div class="logo" style="display:flex;flex-direction:row;align-items:center;gap:16px"><svg width="92" height="92" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="4" width="92" height="92" rx="8" fill="#b3261e"/><rect x="11" y="11" width="78" height="78" rx="4" fill="none" stroke="#ffffff" stroke-width="3"/><text x="50" y="63" font-size="38" text-anchor="middle" fill="#ffffff" font-weight="700" font-family="Noto Serif CJK TC, Noto Sans CJK TC, Liberation Sans">恒泰</text></svg></div></div></div><div><div class="nm">马俊</div><div class="tt">销售副总裁</div></div><div class="bot"><div class="ct"><div class="ln">手机：18861094756</div><div class="ln">maj@hengtai-trade.com</div><div class="ln">www.hengtai-trade.com</div></div><div style="display:flex;gap:20px;align-items:flex-end"><div class="ad"><div class="addr"><div>中国广东省广州市天河区天河路385号1806室</div><div>邮编：510620</div></div></div></div></div></div>
<script>
window.__fit = function(){
  const root = document.documentElement; let s = 1.0;
  const els = Array.from(document.querySelectorAll('.fit'));
  const over = () => els.some(el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
  while (over() && s > 0.5) { s = Math.round((s - 0.03) * 100) / 100; root.style.setProperty('--s', s); }
  return s;
};
</script></body></html>
