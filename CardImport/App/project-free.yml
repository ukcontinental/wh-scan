# XcodeGen spec for a FREE Apple ID ("Personal Team").
# Personal teams cannot reliably sign App Groups, so this variant builds the app only:
# no share extension and no App Group. NFC / Shortcuts and the in-app photo picker work
# the same; "Photos → Share → 名片匯入" needs the paid-account spec (project.yml).
# Use ./setup.sh rather than running this file directly (it fills in your own bundle ID).
name: CardImport
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
packages:
  CardCore:
    path: ../Packages/CardCore
targets:
  CardImport:
    type: application
    platform: iOS
    sources:
      - CardImport
      - Shared
    dependencies:
      - package: CardCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cardimport
        INFOPLIST_KEY_CFBundleDisplayName: 名片匯入
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: CardImport/Info.plist
      properties:
        CFBundleDisplayName: 名片匯入
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSContactsUsageDescription: 用來檢查重複聯絡人，並把名片資料寫入你的通訊錄。
        NSMicrophoneUsageDescription: 錄製選用的語音備註（例如在哪裡認識這個人）。
        NSSpeechRecognitionUsageDescription: 把語音備註轉成文字。
        CFBundleURLTypes:
          - CFBundleURLName: cardimport
            CFBundleURLSchemes: [cardimport]
        BGTaskSchedulerPermittedIdentifiers: [$(PRODUCT_BUNDLE_IDENTIFIER).batch.*]
        UIBackgroundModes: [processing]
schemes:
  CardImport:
    build:
      targets:
        CardImport: all
